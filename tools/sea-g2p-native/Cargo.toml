[package]
name = "sea-g2p-rs"
version = "0.9.1"
edition = "2021"

[lib]
name = "sea_g2p_rs"
crate-type = ["rlib"]

[features]
default = []
python = [
    "dep:pyo3",
    "dep:pyo3-build-config",
]

[dependencies]
pyo3 = {
    version = "0.23",
    optional = true,
    features = [
        "extension-module",
        "abi3-py310",
        "generate-import-lib",
    ],
}

regex = "1.10"
fancy-regex = "0.13"
once_cell = "1.19"
memmap2 = "0.9"
rayon = "1.10"
unicode-normalization = "0.1"

[build-dependencies]
pyo3-build-config = {
    version = "0.23",
    optional = true,
}